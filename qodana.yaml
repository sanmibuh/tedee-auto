####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm-community
withinDocker: false

bootstrap: ./mvnw compile -q

profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses

exclude:
  - name: All
    paths:
      - target
  # Nullability across org.sanmibuh is enforced at compile time by NullAway
  # (-Xep:NullAway:ERROR, AnnotatedPackages=org.sanmibuh), which fails the build on any
  # violation. Qodana's own nullability inspection is redundant there and only produces
  # false positives from heuristics that do not read NullAway's configuration.
  - name: NullableProblems

failureConditions:
  severityThresholds:
    critical: 1
    high: 5
