spring:
  application:
    name: tedee-automation
  web:
    # Locale for user-facing messages; use an IETF language tag such as es.
    locale: en
  datasource:
    # H2 file database on the shared data volume (tedee.mv.db); the schema is created by the separate Liquibase migration image.
    url: jdbc:h2:file:/home/nonroot/data/tedee
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate only validates the schema; Liquibase owns all DDL.
      ddl-auto: validate
  aop:
    # Use JDK dynamic proxies so retry advice targets the LockGateway interface and TedeeLockGateway stays final.
    proxy-target-class: false

sanmibuh:
  notification:
    telegram:
      base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
      admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}
      retry:
        # Retry transient Telegram API failures through the JDK-proxied TelegramGateway.
        max-retries: 2
        initial-interval: 500
        multiplier: 2.0
        max-interval: 5000
  timezone: UTC
  server:
    # Base URL at which the Tedee Bridge can reach this application (e.g. http://192.168.1.20:8080).
    # The empty default makes a missing PUBLIC_URL fail validation instead of binding the literal placeholder.
    public-url: ${PUBLIC_URL:}
  rest:
    tedee:
      # TEDEE_BASE_URL permits HTTPS and reverse-proxy paths; the legacy host value targets the local API.
      base-url: ${TEDEE_BASE_URL:http://${TEDEE_HOST:}/v1.0}
      api-key: ${TEDEE_API_KEY:}
      callback-secret: ${TEDEE_CALLBACK_SECRET:}
      retry:
        # Retry policy for transient Tedee bridge errors (device disconnected / BLE recovery).
        max-retries: 3
        initial-interval: 500
        multiplier: 2.0
        max-interval: 5000
  scheduler:
    lock:
      # Timezone in which the cron expressions below are interpreted.
      zone: ${sanmibuh.timezone}
      # Map of deviceId -> cron expression. Configure per environment, e.g.:
      #   SANMIBUH_SCHEDULER_LOCK_SCHEDULES_12345="0 0 0,22 * * *"  # 00:00 and 22:00 every day

logging:
  pattern:
    # Print log timestamps in the configured timezone without changing the JVM default.
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS,${sanmibuh.timezone}"
