# Tests build the schema from the Liquibase changelog (dropping it first) and Hibernate only validates it.
# Override the database with -Dtest.db.url, e.g. -Dtest.db.url=jdbc:h2:file:./target/test-db/tedee
spring.datasource.url=${test.db.url:jdbc:h2:mem:tedee}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=true
