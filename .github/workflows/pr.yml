name: PR Check

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check formatting (Spotless)
        run: ./mvnw spotless:check -B

  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.results.outputs.tests }}
      passed: ${{ steps.results.outputs.passed }}
      failures: ${{ steps.results.outputs.failures }}
      errors: ${{ steps.results.outputs.errors }}
      skipped: ${{ steps.results.outputs.skipped }}
      status: ${{ steps.results.outputs.status }}
      instruction: ${{ steps.results.outputs.instruction }}
      instruction_covered: ${{ steps.results.outputs.instruction_covered }}
      instruction_total: ${{ steps.results.outputs.instruction_total }}
      branch: ${{ steps.results.outputs.branch }}
      branch_covered: ${{ steps.results.outputs.branch_covered }}
      branch_total: ${{ steps.results.outputs.branch_total }}
      line: ${{ steps.results.outputs.line }}
      line_covered: ${{ steps.results.outputs.line_covered }}
      line_total: ${{ steps.results.outputs.line_total }}
      method: ${{ steps.results.outputs.method }}
      method_covered: ${{ steps.results.outputs.method_covered }}
      method_total: ${{ steps.results.outputs.method_total }}
      class: ${{ steps.results.outputs.class }}
      class_covered: ${{ steps.results.outputs.class_covered }}
      class_total: ${{ steps.results.outputs.class_total }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: |
          set -o pipefail
          ./mvnw verify -B -Dspotless.skip=true 2>&1 | tee build.log

      - name: Parse test results and JaCoCo coverage
        id: results
        if: always()
        run: |
          TESTS=$(grep -oP 'Tests run: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          FAILURES=$(grep -oP 'Failures: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          ERRORS=$(grep -oP 'Errors: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          SKIPPED=$(grep -oP 'Skipped: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))

          echo "tests=$TESTS"       >> "$GITHUB_OUTPUT"
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORS"     >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED"   >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED"     >> "$GITHUB_OUTPUT"

          if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          JACOCO_XML="target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            extract_metric() {
              local type=$1 varname=$2
              local missed covered total pct
              missed=$(grep -oP "type=\"${type}\" missed=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              covered=$(grep -oP "type=\"${type}\" missed=\"[0-9]+\" covered=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              total=$((missed + covered))
              if [ "$total" -eq 0 ]; then pct=-1; else pct=$((covered * 100 / total)); fi
              echo "${varname}=${pct}"           >> "$GITHUB_OUTPUT"
              echo "${varname}_covered=${covered}" >> "$GITHUB_OUTPUT"
              echo "${varname}_total=${total}"     >> "$GITHUB_OUTPUT"
            }
            extract_metric INSTRUCTION instruction
            extract_metric BRANCH       branch
            extract_metric LINE         line
            extract_metric METHOD       method
            extract_metric CLASS        class
          else
            for m in instruction branch line method class; do
              echo "${m}=-1"        >> "$GITHUB_OUTPUT"
              echo "${m}_covered=0" >> "$GITHUB_OUTPUT"
              echo "${m}_total=0"   >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: ignore

  pitest:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      killed: ${{ steps.results.outputs.killed }}
      total: ${{ steps.results.outputs.total }}
      score: ${{ steps.results.outputs.score }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore PITest history
        run: |
          git fetch origin coverage-data 2>/dev/null || true
          mkdir -p .pit
          git show origin/coverage-data:pitest-history.bin > .pit/history-input.bin 2>/dev/null || true

      - name: Run mutation tests (incremental)
        run: |
          set -o pipefail
          ./mvnw test-compile pitest:mutationCoverage -B \
            -Dspotless.skip=true \
            2>&1 | tee pitest.log

      - name: Parse PITest results
        id: results
        if: always()
        run: |
          MUTATIONS_XML="target/pit-reports/mutations.xml"
          if [ -f "$MUTATIONS_XML" ]; then
            TOTAL=$(grep -c '<mutation ' "$MUTATIONS_XML") || TOTAL=0
            KILLED=$(grep -oP "status='\K[^']+" "$MUTATIONS_XML" | grep -c "^KILLED$") || KILLED=0
            if [ "$TOTAL" -gt 0 ]; then
              SCORE=$((KILLED * 100 / TOTAL))
            else
              SCORE=-1
            fi
          else
            TOTAL=0; KILLED=0; SCORE=-1
          fi
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "killed=$KILLED" >> "$GITHUB_OUTPUT"
          echo "score=$SCORE"   >> "$GITHUB_OUTPUT"

      - name: Upload PITest mutations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutations
          path: target/pit-reports/mutations.xml
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    needs: [test, pitest]
    if: always() && github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
        continue-on-error: true

      - name: Download surefire reports
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: surefire-reports
        continue-on-error: true

      - name: Download PITest mutations
        uses: actions/download-artifact@v4
        with:
          name: pitest-mutations
          path: pitest-mutations
        continue-on-error: true

      - name: Parse per-class coverage
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os

          if not os.path.exists('jacoco.xml'):
            with open('class_details.md', 'w') as f:
              f.write('_No JaCoCo report available._')
          else:
            tree = ET.parse('jacoco.xml')
            classes = []
            for cls in tree.getroot().iter('class'):
              simple_name = cls.get('name', '').split('/')[-1]
              for counter in cls.findall('counter'):
                if counter.get('type') == 'LINE':
                  missed  = int(counter.get('missed', 0))
                  covered = int(counter.get('covered', 0))
                  total   = missed + covered
                  if total > 0 and missed > 0:
                    classes.append((simple_name, covered * 100 // total, covered, total))

            classes.sort(key=lambda x: x[1])

            if not classes:
              output = '_All classes reach 100% line coverage._'
            else:
              rows = ['| Class | Line Coverage |', '|-------|:-------------:|']
              for name, pct, cov, tot in classes:
                rows.append(f'| `{name}` | {pct}% ({cov}/{tot}) |')
              output = '\n'.join(rows)

            with open('class_details.md', 'w') as f:
              f.write(output)
          PYEOF

      - name: Parse surefire reports for failing tests
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os, glob

          reports = glob.glob('surefire-reports/TEST-*.xml')
          failures, errors, skipped = [], [], []

          for path in sorted(reports):
            try:
              root = ET.parse(path).getroot()
            except ET.ParseError:
              continue
            for tc in root.findall('testcase'):
              classname = tc.get('classname', '')
              name = tc.get('name', '')
              label = f'{classname}.{name}' if classname else name
              if tc.find('failure') is not None:
                failures.append(label)
              elif tc.find('error') is not None:
                errors.append(label)
              elif tc.find('skipped') is not None:
                skipped.append(label)

          lines = []
          if failures:
            lines.append('**❌ Failed:**')
            lines.extend(f'- `{t}`' for t in failures)
          if errors:
            if lines: lines.append('')
            lines.append('**💥 Errors:**')
            lines.extend(f'- `{t}`' for t in errors)
          if skipped:
            if lines: lines.append('')
            lines.append('**⏭️ Skipped:**')
            lines.extend(f'- `{t}`' for t in skipped)

          with open('test_details.md', 'w') as f:
            f.write('\n'.join(lines))
          PYEOF

      - name: Parse PITest mutations for surviving mutants
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os

          mutations_xml = 'pitest-mutations/mutations.xml'
          if not os.path.exists(mutations_xml):
            with open('pitest_details.md', 'w') as f:
              f.write('_No PITest report available._')
          else:
            root = ET.parse(mutations_xml).getroot()
            surviving = []
            for m in root.findall('mutation'):
              status = m.get('status', '')
              if status in ('SURVIVED', 'NO_COVERAGE'):
                fqcn = m.findtext('mutatedClass', '')
                simple_cls = fqcn.split('.')[-1] if fqcn else '?'
                line = m.findtext('lineNumber', '?')
                desc = m.findtext('description', '')
                surviving.append((simple_cls, line, desc, status))

            if not surviving:
              output = '_All mutants killed. 🎉_'
            else:
              surviving.sort(key=lambda x: (x[0], int(x[1]) if x[1].isdigit() else 0))
              rows = ['| Class | Line | Mutant | Status |',
                      '|-------|-----:|-------|--------|']
              for cls, line, desc, status in surviving:
                emoji = '🧟' if status == 'SURVIVED' else '🕳️'
                rows.append(f'| `{cls}` | {line} | {desc} | {emoji} {status} |')
              output = '\n'.join(rows)

            with open('pitest_details.md', 'w') as f:
              f.write(output)
          PYEOF

      - name: Fetch baseline metrics
        id: baseline
        run: |
          git fetch origin coverage-data 2>/dev/null || true

          fetch_json_metric() {
            local file=$1 key=$2
            git show origin/coverage-data:"$file" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$key', -1))" 2>/dev/null \
              || echo "-1"
          }

          for m in instruction branch line method class; do
            echo "${m}=$(fetch_json_metric coverage.json $m)"                     >> "$GITHUB_OUTPUT"
            echo "${m}_covered=$(fetch_json_metric coverage.json ${m}_covered)"   >> "$GITHUB_OUTPUT"
            echo "${m}_total=$(fetch_json_metric coverage.json ${m}_total)"       >> "$GITHUB_OUTPUT"
          done
          echo "pit_killed=$(fetch_json_metric pitest.json killed)" >> "$GITHUB_OUTPUT"
          echo "pit_total=$(fetch_json_metric pitest.json total)"   >> "$GITHUB_OUTPUT"
          echo "pit_score=$(fetch_json_metric pitest.json score)"   >> "$GITHUB_OUTPUT"

      - name: Comment PR with report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status   = '${{ needs.test.outputs.status }}';
            const tests    = parseInt('${{ needs.test.outputs.tests }}');
            const passed   = parseInt('${{ needs.test.outputs.passed }}');
            const failures = parseInt('${{ needs.test.outputs.failures }}');
            const errors   = parseInt('${{ needs.test.outputs.errors }}');
            const skipped  = parseInt('${{ needs.test.outputs.skipped }}');

            const cur = {
              instruction: parseInt('${{ needs.test.outputs.instruction }}'),
              instruction_covered: parseInt('${{ needs.test.outputs.instruction_covered }}'),
              instruction_total:   parseInt('${{ needs.test.outputs.instruction_total }}'),
              branch:      parseInt('${{ needs.test.outputs.branch }}'),
              branch_covered:      parseInt('${{ needs.test.outputs.branch_covered }}'),
              branch_total:        parseInt('${{ needs.test.outputs.branch_total }}'),
              line:        parseInt('${{ needs.test.outputs.line }}'),
              line_covered:        parseInt('${{ needs.test.outputs.line_covered }}'),
              line_total:          parseInt('${{ needs.test.outputs.line_total }}'),
              method:      parseInt('${{ needs.test.outputs.method }}'),
              method_covered:      parseInt('${{ needs.test.outputs.method_covered }}'),
              method_total:        parseInt('${{ needs.test.outputs.method_total }}'),
              class:       parseInt('${{ needs.test.outputs.class }}'),
              class_covered:       parseInt('${{ needs.test.outputs.class_covered }}'),
              class_total:         parseInt('${{ needs.test.outputs.class_total }}'),
            };
            const base = {
              instruction: parseInt('${{ steps.baseline.outputs.instruction }}'),
              instruction_covered: parseInt('${{ steps.baseline.outputs.instruction_covered }}'),
              instruction_total:   parseInt('${{ steps.baseline.outputs.instruction_total }}'),
              branch:      parseInt('${{ steps.baseline.outputs.branch }}'),
              branch_covered:      parseInt('${{ steps.baseline.outputs.branch_covered }}'),
              branch_total:        parseInt('${{ steps.baseline.outputs.branch_total }}'),
              line:        parseInt('${{ steps.baseline.outputs.line }}'),
              line_covered:        parseInt('${{ steps.baseline.outputs.line_covered }}'),
              line_total:          parseInt('${{ steps.baseline.outputs.line_total }}'),
              method:      parseInt('${{ steps.baseline.outputs.method }}'),
              method_covered:      parseInt('${{ steps.baseline.outputs.method_covered }}'),
              method_total:        parseInt('${{ steps.baseline.outputs.method_total }}'),
              class:       parseInt('${{ steps.baseline.outputs.class }}'),
              class_covered:       parseInt('${{ steps.baseline.outputs.class_covered }}'),
              class_total:         parseInt('${{ steps.baseline.outputs.class_total }}'),
            };

            const pitCur  = {
              killed: parseInt('${{ needs.pitest.outputs.killed }}'),
              total:  parseInt('${{ needs.pitest.outputs.total }}'),
              score:  parseInt('${{ needs.pitest.outputs.score }}'),
            };
            const pitBase = {
              killed: parseInt('${{ steps.baseline.outputs.pit_killed }}'),
              total:  parseInt('${{ steps.baseline.outputs.pit_total }}'),
              score:  parseInt('${{ steps.baseline.outputs.pit_score }}'),
            };

            const fmt = (pct, cov, tot) => {
              if (pct < 0) return 'N/A';
              if (tot > 0) return `${pct}% (${cov}/${tot})`;
              return `${pct}%`;
            };
            const diff = (c, b) => {
              if (c < 0 || b < 0) return '';
              const d = c - b;
              if (d > 0) return `**+${d}%** ⬆️`;
              if (d < 0) return `**${d}%** ⬇️`;
              return '➡️';
            };

            // Semaphore: coverage thresholds 90/70, mutation 80/60
            const semCov = (v) => v < 0 ? '⚪' : v >= 90 ? '🟢' : v >= 70 ? '🟡' : '🔴';
            const semPit = (v) => v < 0 ? '⚪' : v >= 80 ? '🟢' : v >= 60 ? '🟡' : '🔴';

            const classDetails = fs.existsSync('class_details.md')
              ? fs.readFileSync('class_details.md', 'utf8')
              : '_No data available._';

            const testDetails = fs.existsSync('test_details.md')
              ? fs.readFileSync('test_details.md', 'utf8').trim()
              : '';

            const pitDetails = fs.existsSync('pitest_details.md')
              ? fs.readFileSync('pitest_details.md', 'utf8')
              : '_No data available._';

            const pitJobResult = '${{ needs.pitest.result }}';
            const pitAvailable = pitJobResult === 'success' && pitCur.score >= 0;

            // One-line summary
            const testSummary  = status === 'passed'
              ? `${passed} passed`
              : `${failures} failed, ${errors} errors`;
            const covSummary   = cur.line >= 0 ? `lines ${cur.line}%` : '';
            const pitSummary   = pitAvailable ? `mutations ${pitCur.score}%` : '';
            const summaryParts = [testSummary, covSummary, pitSummary].filter(Boolean);

            const headerIcon = status === 'passed' ? '✅' : '❌';
            const headerText = status === 'passed' ? 'All tests passed' : 'Tests failed';

            // Failures block (shown prominently only when there are failures)
            const failureSection = (failures > 0 || errors > 0) ? [
              '',
              '> [!CAUTION]',
              `> **${failures} failure(s) and ${errors} error(s)** — check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
            ] : [];

            // Metrics table
            const pitRow = pitAvailable
              ? `| ${semPit(pitCur.score)} | Mutation Score | ${fmt(pitBase.score, pitBase.killed, pitBase.total)} | ${fmt(pitCur.score, pitCur.killed, pitCur.total)} | ${diff(pitCur.score, pitBase.score)} | ${pitCur.killed}/${pitCur.total} |`
              : `| ⚪ | Mutation Score | — | — | ⚠️ did not run | — |`;

            const metricsTable = [
              '| | Metric | `main` | PR | Diff | Detail |',
              '|:---:|---|:---:|:---:|:---:|---|',
              `| ${semCov(cur.instruction)} | Instructions | ${fmt(base.instruction, base.instruction_covered, base.instruction_total)} | ${fmt(cur.instruction, cur.instruction_covered, cur.instruction_total)} | ${diff(cur.instruction, base.instruction)} | ${cur.instruction_covered}/${cur.instruction_total} |`,
              `| ${semCov(cur.branch)}      | Branches     | ${fmt(base.branch, base.branch_covered, base.branch_total)}           | ${fmt(cur.branch, cur.branch_covered, cur.branch_total)}           | ${diff(cur.branch, base.branch)}           | ${cur.branch_covered}/${cur.branch_total} |`,
              `| ${semCov(cur.line)}        | Lines        | ${fmt(base.line, base.line_covered, base.line_total)}               | ${fmt(cur.line, cur.line_covered, cur.line_total)}                 | ${diff(cur.line, base.line)}               | ${cur.line_covered}/${cur.line_total} |`,
              `| ${semCov(cur.method)}      | Methods      | ${fmt(base.method, base.method_covered, base.method_total)}         | ${fmt(cur.method, cur.method_covered, cur.method_total)}           | ${diff(cur.method, base.method)}           | ${cur.method_covered}/${cur.method_total} |`,
              `| ${semCov(cur.class)}       | Classes      | ${fmt(base.class, base.class_covered, base.class_total)}           | ${fmt(cur.class, cur.class_covered, cur.class_total)}             | ${diff(cur.class, base.class)}             | ${cur.class_covered}/${cur.class_total} |`,
              pitRow,
            ];

            // Tests detail — only shown when there are non-passing tests
            const hasNonPassing = failures > 0 || errors > 0 || skipped > 0;
            const testsSection = hasNonPassing ? [
              '<details>',
              `<summary>🧪 Tests — ${passed}/${tests} passed</summary>`,
              '',
              testDetails || '_No test detail available._',
              '',
              '</details>',
              '',
            ] : [];

            // PITest detail — only shown when pitest ran
            const pitestSection = pitAvailable ? [
              '<details>',
              `<summary>🧬 PITest mutations — ${pitCur.killed}/${pitCur.total} killed</summary>`,
              '',
              pitDetails,
              '',
              '</details>',
              '',
            ] : [];

            const MARKER = '<!-- tedee-auto-ci-report -->';

            const body = [
              MARKER,
              `## ${headerIcon} ${headerText}`,
              `> ${summaryParts.join(' · ')}`,
              ...failureSection,
              '',
              ...metricsTable,
              '',
              ...testsSection,
              '<details>',
              '<summary>📉 Classes below 100% line coverage</summary>',
              '',
              classDetails,
              '',
              '</details>',
              '',
              ...pitestSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
