name: PR Check

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fetch baseline from coverage-data branch
        id: baseline
        run: |
          git fetch origin coverage-data 2>/dev/null || true

          fetch_json_metric() {
            local file=$1 key=$2
            git show origin/coverage-data:"$file" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$key', -1))" 2>/dev/null \
              || echo "-1"
          }

          echo "instruction=$(fetch_json_metric coverage.json instruction)" >> "$GITHUB_OUTPUT"
          echo "branch=$(fetch_json_metric coverage.json branch)"           >> "$GITHUB_OUTPUT"
          echo "line=$(fetch_json_metric coverage.json line)"               >> "$GITHUB_OUTPUT"
          echo "method=$(fetch_json_metric coverage.json method)"           >> "$GITHUB_OUTPUT"
          echo "class=$(fetch_json_metric coverage.json class)"             >> "$GITHUB_OUTPUT"

          echo "pit_killed=$(fetch_json_metric pitest.json killed)"         >> "$GITHUB_OUTPUT"
          echo "pit_total=$(fetch_json_metric pitest.json total)"           >> "$GITHUB_OUTPUT"
          echo "pit_score=$(fetch_json_metric pitest.json score)"           >> "$GITHUB_OUTPUT"

          # Restore pitest history file for incremental analysis
          git show origin/coverage-data:pitest-history.bin > pitest-history-input.bin 2>/dev/null || true

      - name: Build and test
        run: ./mvnw verify -B 2>&1 | tee build.log

      - name: Run mutation tests (incremental)
        id: pitest
        if: success()
        run: |
          ./mvnw pitest:mutationCoverage -B \
            -Dpitest.historyInputFile=pitest-history-input.bin \
            -Dpitest.historyOutputFile=pitest-history-output.bin \
            2>&1 | tee pitest.log

          MUTATIONS_XML="target/pit-reports/mutations.xml"
          if [ -f "$MUTATIONS_XML" ]; then
            TOTAL=$(grep -c '<mutation ' "$MUTATIONS_XML") || TOTAL=0
            KILLED=$(grep -oP 'status="\K[^"]+' "$MUTATIONS_XML" | grep -c "^KILLED$") || KILLED=0
            if [ "$TOTAL" -gt 0 ]; then
              SCORE=$((KILLED * 100 / TOTAL))
            else
              SCORE=-1
            fi
          else
            TOTAL=0; KILLED=0; SCORE=-1
          fi

          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "killed=$KILLED" >> "$GITHUB_OUTPUT"
          echo "score=$SCORE"   >> "$GITHUB_OUTPUT"

      - name: Parse JaCoCo coverage
        id: coverage
        if: always()
        run: |
          TESTS=$(grep -oP 'Tests run: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          FAILURES=$(grep -oP 'Failures: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          ERRORS=$(grep -oP 'Errors: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          SKIPPED=$(grep -oP 'Skipped: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))

          echo "tests=$TESTS"       >> "$GITHUB_OUTPUT"
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORS"     >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED"   >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED"     >> "$GITHUB_OUTPUT"

          if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          JACOCO_XML="target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            extract_pct() {
              local type=$1
              local missed covered total
              missed=$(grep -oP "type=\"${type}\" missed=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              covered=$(grep -oP "type=\"${type}\" missed=\"[0-9]+\" covered=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              total=$((missed + covered))
              if [ "$total" -eq 0 ]; then echo "-1"; else echo "$((covered * 100 / total))"; fi
            }
            echo "instruction=$(extract_pct INSTRUCTION)" >> "$GITHUB_OUTPUT"
            echo "branch=$(extract_pct BRANCH)"           >> "$GITHUB_OUTPUT"
            echo "line=$(extract_pct LINE)"               >> "$GITHUB_OUTPUT"
            echo "method=$(extract_pct METHOD)"           >> "$GITHUB_OUTPUT"
            echo "class=$(extract_pct CLASS)"             >> "$GITHUB_OUTPUT"
          else
            echo "instruction=-1" >> "$GITHUB_OUTPUT"
            echo "branch=-1"      >> "$GITHUB_OUTPUT"
            echo "line=-1"        >> "$GITHUB_OUTPUT"
            echo "method=-1"      >> "$GITHUB_OUTPUT"
            echo "class=-1"       >> "$GITHUB_OUTPUT"
          fi

      - name: Comment PR with report
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status   = '${{ steps.coverage.outputs.status }}';
            const tests    = '${{ steps.coverage.outputs.tests }}';
            const passed   = '${{ steps.coverage.outputs.passed }}';
            const failures = '${{ steps.coverage.outputs.failures }}';
            const errors   = '${{ steps.coverage.outputs.errors }}';
            const skipped  = '${{ steps.coverage.outputs.skipped }}';

            const cur = {
              instruction: parseInt('${{ steps.coverage.outputs.instruction }}'),
              branch:      parseInt('${{ steps.coverage.outputs.branch }}'),
              line:        parseInt('${{ steps.coverage.outputs.line }}'),
              method:      parseInt('${{ steps.coverage.outputs.method }}'),
              class:       parseInt('${{ steps.coverage.outputs.class }}'),
            };
            const base = {
              instruction: parseInt('${{ steps.baseline.outputs.instruction }}'),
              branch:      parseInt('${{ steps.baseline.outputs.branch }}'),
              line:        parseInt('${{ steps.baseline.outputs.line }}'),
              method:      parseInt('${{ steps.baseline.outputs.method }}'),
              class:       parseInt('${{ steps.baseline.outputs.class }}'),
            };

            const pitCur  = { killed: parseInt('${{ steps.pitest.outputs.killed }}'),  total: parseInt('${{ steps.pitest.outputs.total }}'),  score: parseInt('${{ steps.pitest.outputs.score }}') };
            const pitBase = { killed: parseInt('${{ steps.baseline.outputs.pit_killed }}'), total: parseInt('${{ steps.baseline.outputs.pit_total }}'), score: parseInt('${{ steps.baseline.outputs.pit_score }}') };

            const fmt = (v) => v < 0 ? 'N/A' : `${v}%`;
            const diff = (cur, base) => {
              if (cur < 0) return '';
              if (base < 0) return '_(no baseline)_';
              const d = cur - base;
              if (d > 0) return `+${d}% ⬆️`;
              if (d < 0) return `${d}% ⬇️`;
              return `0% ➡️`;
            };

            const pitSection = pitCur.score >= 0
              ? [
                  '',
                  '### Mutation Testing (PITest) vs `main`',
                  '',
                  '| Metric         | Main                                     | PR                                      | Diff                               |',
                  '|----------------|:----------------------------------------:|:---------------------------------------:|:----------------------------------:|',
                  `| Score          | ${fmt(pitBase.score)}                    | ${fmt(pitCur.score)}                    | ${diff(pitCur.score, pitBase.score)} |`,
                  `| Killed/Total   | ${pitBase.killed < 0 ? 'N/A' : pitBase.killed + '/' + pitBase.total} | ${pitCur.killed}/${pitCur.total} | |`,
                ]
              : ['', '> ⚠️ Mutation testing did not run (tests may have failed)'];

            const icon  = status === 'passed' ? '✅' : '❌';
            const title = status === 'passed' ? `${icon} All tests passed` : `${icon} Tests failed`;

            const body = [
              `## ${title}`,
              '',
              '### Tests',
              '',
              '| Result      | Count        |',
              '|-------------|-------------:|',
              `| ✅ Passed   | ${passed}    |`,
              `| ❌ Failed   | ${failures}  |`,
              `| 💥 Errors   | ${errors}    |`,
              `| ⏭️ Skipped  | ${skipped}   |`,
              `| **Total**   | **${tests}** |`,
              '',
              '### Coverage (JaCoCo) vs `main`',
              '',
              '| Metric       | Main                     | PR                      | Diff                          |',
              '|--------------|:------------------------:|:-----------------------:|:-----------------------------:|',
              `| Instructions | ${fmt(base.instruction)} | ${fmt(cur.instruction)} | ${diff(cur.instruction, base.instruction)} |`,
              `| Branches     | ${fmt(base.branch)}      | ${fmt(cur.branch)}      | ${diff(cur.branch, base.branch)}           |`,
              `| Lines        | ${fmt(base.line)}        | ${fmt(cur.line)}        | ${diff(cur.line, base.line)}               |`,
              `| Methods      | ${fmt(base.method)}      | ${fmt(cur.method)}      | ${diff(cur.method, base.method)}           |`,
              `| Classes      | ${fmt(base.class)}       | ${fmt(cur.class)}       | ${diff(cur.class, base.class)}             |`,
              ...pitSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith('## ')
            );

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
