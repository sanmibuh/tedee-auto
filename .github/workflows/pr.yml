name: PR Check

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fetch main coverage baseline
        id: baseline
        run: |
          fetch_metric() {
            local key=$1
            local val
            val=$(git show origin/coverage-data:coverage.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$key', -1))" 2>/dev/null || echo "-1")
            echo "$val"
          }

          git fetch origin coverage-data 2>/dev/null || true

          echo "instruction=$(fetch_metric instruction)" >> "$GITHUB_OUTPUT"
          echo "branch=$(fetch_metric branch)"           >> "$GITHUB_OUTPUT"
          echo "line=$(fetch_metric line)"               >> "$GITHUB_OUTPUT"
          echo "method=$(fetch_metric method)"           >> "$GITHUB_OUTPUT"
          echo "class=$(fetch_metric class)"             >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./mvnw verify -B 2>&1 | tee build.log

      - name: Parse test and coverage results
        id: results
        if: always()
        run: |
          TESTS=$(grep -oP 'Tests run: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          FAILURES=$(grep -oP 'Failures: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          ERRORS=$(grep -oP 'Errors: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          SKIPPED=$(grep -oP 'Skipped: \K[0-9]+' build.log | awk '{s+=$1} END {print s+0}')
          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))

          echo "tests=$TESTS"       >> "$GITHUB_OUTPUT"
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORS"     >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED"   >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED"     >> "$GITHUB_OUTPUT"

          if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          JACOCO_XML="target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            extract_pct() {
              local type=$1
              local missed covered total
              missed=$(grep -oP "type=\"${type}\" missed=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              covered=$(grep -oP "type=\"${type}\" missed=\"[0-9]+\" covered=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
              total=$((missed + covered))
              if [ "$total" -eq 0 ]; then echo "-1"; else echo "$((covered * 100 / total))"; fi
            }
            echo "instruction=$(extract_pct INSTRUCTION)" >> "$GITHUB_OUTPUT"
            echo "branch=$(extract_pct BRANCH)"           >> "$GITHUB_OUTPUT"
            echo "line=$(extract_pct LINE)"               >> "$GITHUB_OUTPUT"
            echo "method=$(extract_pct METHOD)"           >> "$GITHUB_OUTPUT"
            echo "class=$(extract_pct CLASS)"             >> "$GITHUB_OUTPUT"
          else
            echo "instruction=-1" >> "$GITHUB_OUTPUT"
            echo "branch=-1"      >> "$GITHUB_OUTPUT"
            echo "line=-1"        >> "$GITHUB_OUTPUT"
            echo "method=-1"      >> "$GITHUB_OUTPUT"
            echo "class=-1"       >> "$GITHUB_OUTPUT"
          fi

      - name: Comment PR with report
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status   = '${{ steps.results.outputs.status }}';
            const tests    = '${{ steps.results.outputs.tests }}';
            const passed   = '${{ steps.results.outputs.passed }}';
            const failures = '${{ steps.results.outputs.failures }}';
            const errors   = '${{ steps.results.outputs.errors }}';
            const skipped  = '${{ steps.results.outputs.skipped }}';

            const cur = {
              instruction: parseInt('${{ steps.results.outputs.instruction }}'),
              branch:      parseInt('${{ steps.results.outputs.branch }}'),
              line:        parseInt('${{ steps.results.outputs.line }}'),
              method:      parseInt('${{ steps.results.outputs.method }}'),
              class:       parseInt('${{ steps.results.outputs.class }}'),
            };
            const base = {
              instruction: parseInt('${{ steps.baseline.outputs.instruction }}'),
              branch:      parseInt('${{ steps.baseline.outputs.branch }}'),
              line:        parseInt('${{ steps.baseline.outputs.line }}'),
              method:      parseInt('${{ steps.baseline.outputs.method }}'),
              class:       parseInt('${{ steps.baseline.outputs.class }}'),
            };

            const fmt = (v) => v < 0 ? 'N/A' : `${v}%`;
            const diff = (key) => {
              if (cur[key] < 0) return '';
              if (base[key] < 0) return '_(no baseline)_';
              const d = cur[key] - base[key];
              if (d > 0) return `+${d}% ⬆️`;
              if (d < 0) return `${d}% ⬇️`;
              return `0% ➡️`;
            };

            const icon = status === 'passed' ? '✅' : '❌';
            const title = status === 'passed' ? `${icon} All tests passed` : `${icon} Tests failed`;

            const body = [
              `## ${title}`,
              '',
              '### Tests',
              '',
              '| Result      | Count        |',
              '|-------------|-------------:|',
              `| ✅ Passed   | ${passed}     |`,
              `| ❌ Failed   | ${failures}   |`,
              `| 💥 Errors   | ${errors}     |`,
              `| ⏭️ Skipped  | ${skipped}    |`,
              `| **Total**   | **${tests}**  |`,
              '',
              '### Coverage (JaCoCo) vs `main`',
              '',
              '| Metric       | Main                          | PR                           | Diff         |',
              '|--------------|:-----------------------------:|:----------------------------:|:------------:|',
              `| Instructions | ${fmt(base.instruction)}      | ${fmt(cur.instruction)}      | ${diff('instruction')} |`,
              `| Branches     | ${fmt(base.branch)}           | ${fmt(cur.branch)}           | ${diff('branch')}      |`,
              `| Lines        | ${fmt(base.line)}             | ${fmt(cur.line)}             | ${diff('line')}        |`,
              `| Methods      | ${fmt(base.method)}           | ${fmt(cur.method)}           | ${diff('method')}      |`,
              `| Classes      | ${fmt(base.class)}            | ${fmt(cur.class)}            | ${diff('class')}       |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith('## ')
            );

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
