name: Release — Create Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A non-default token so the release PR's pull_request event fires and
          # the required checks (lint/test/pitest) run automatically for --auto.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Single-release guard
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          OPEN_RELEASE=$(gh pr list --state open --base main \
            --json headRefName \
            --jq '[.[] | select(.headRefName | test("^(release/v|chore/next-snapshot-v)"))] | length')
          if [ "$OPEN_RELEASE" -gt 0 ]; then
            echo "ERROR: a release or snapshot-bump PR is already open. Aborting to keep a single release in progress."
            exit 1
          fi

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compute release version
        id: version
        run: |
          SNAPSHOT=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$SNAPSHOT" != *-SNAPSHOT ]]; then
            echo "ERROR: project.version is '${SNAPSHOT}' — expected a -SNAPSHOT version. Aborting."
            exit 1
          fi
          BASE="${SNAPSHOT%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) ;;
          esac

          RELEASE="${MAJOR}.${MINOR}.${PATCH}"

          echo "release=${RELEASE}"           >> "$GITHUB_OUTPUT"
          echo "branch=release/v${RELEASE}"   >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name  "${{ vars.RELEASE_BOT_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.RELEASE_BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      - name: Create release branch
        run: git checkout -b "${{ steps.version.outputs.branch }}"

      - name: Set release version in pom.xml
        run: |
          ./mvnw versions:set \
            -DnewVersion="${{ steps.version.outputs.release }}" \
            -DgenerateBackupPoms=false \
            -B

      - name: Generate changelog preview for PR body
        id: notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          export VERSION="${{ steps.version.outputs.release }}"
          export TODAY=$(date +%Y-%m-%d)

          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            # Normalize to UTC 'Z' so the lexical string comparison against
            # GitHub's UTC merged_at timestamps is correct. The tag's authored
            # date carries a local offset (e.g. +02:00), which would otherwise
            # break the comparison and drop legitimately newer PRs.
            SINCE=$(date -u -d "$(git log -1 --format=%aI "$PREV_TAG")" +%Y-%m-%dT%H:%M:%SZ)
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          # Exclude mechanical release PRs (the release PR itself and the
          # post-release snapshot bump) so they never leak into the changelog.
          PRS=$(gh api \
            "repos/${{ github.repository }}/pulls?state=closed&base=main&per_page=100&sort=updated&direction=desc" \
            --jq "[.[] | select(.merged_at != null and .merged_at > \"${SINCE}\" and (.head.ref | test(\"^(release/v|chore/next-snapshot-v)\") | not)) | {title: .title, number: .number, url: .html_url}]")

          echo "$PRS" > "$RUNNER_TEMP/prs.json"

          PRS_FILE="$RUNNER_TEMP/prs.json" python3 .github/scripts/render_changelog.py > pr_body.md

      - name: Commit and push release branch
        run: |
          git add pom.xml
          git commit -m "Release v${{ steps.version.outputs.release }}"
          git push origin "${{ steps.version.outputs.branch }}"

      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh label create release \
            --color "0075ca" \
            --description "Release PR" \
            2>/dev/null || true

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          {
            echo "> **Preview only.** The authoritative \`CHANGELOG.md\` and release notes are generated at publish time from all PRs merged up to this PR's merge commit. If more PRs land before this one merges, they will be included then."
            echo
            cat pr_body.md
          } > pr_final.md

          gh pr create \
            --base main \
            --head "${{ steps.version.outputs.branch }}" \
            --title "Release v${{ steps.version.outputs.release }}" \
            --body-file pr_final.md \
            --label release
