name: Release — Full-auto (build, publish, tag, changelog)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

# Serialise releases: only one may run at a time. This replaces the old
# "single-release guard" that inspected open PRs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # A PAT with bypass so the release commits can be pushed directly to
          # protected main and attributed to a real identity.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure git identity
        run: |
          git config user.name  "${{ vars.RELEASE_BOT_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.RELEASE_BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      # 2 + 3: compute the release version from the current -SNAPSHOT and set it
      # in pom.xml on the runner. Nothing is committed yet — main is untouched
      # until the release is proven good.
      - name: Compute release version
        id: version
        run: |
          SNAPSHOT=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$SNAPSHOT" != *-SNAPSHOT ]]; then
            echo "ERROR: project.version is '${SNAPSHOT}' — expected a -SNAPSHOT version. Aborting."
            exit 1
          fi
          BASE="${SNAPSHOT%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) ;;
          esac

          RELEASE="${MAJOR}.${MINOR}.${PATCH}"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set release version in pom.xml
        run: |
          ./mvnw versions:set \
            -DnewVersion="${{ steps.version.outputs.release }}" \
            -DgenerateBackupPoms=false \
            -B

      # 4: technical gate on the exact release state. Replaces the CI checks the
      # old PR-based flow ran on the release commit.
      - name: Verify
        run: ./mvnw -B verify

      # Generate the authoritative CHANGELOG entry BEFORE building the image, so
      # a bad/empty changelog aborts the run before anything irreversible. The
      # entry is written into CHANGELOG.md (uncommitted) and kept as release
      # notes for the GitHub Release.
      - name: Generate changelog entry
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          export VERSION="${{ steps.version.outputs.release }}"
          export TODAY=$(date +%Y-%m-%d)

          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            # Normalize to UTC 'Z' so the lexical comparison against GitHub's UTC
            # merged_at timestamps is correct.
            SINCE=$(date -u -d "$(git log -1 --format=%aI "$PREV_TAG")" +%Y-%m-%dT%H:%M:%SZ)
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          # The changelog must describe exactly the source state that was built,
          # verified and is about to be tagged — no more. Pin it to the checked-out
          # main commit so a PR that merges into main WHILE this release is building
          # (concurrency: release does not serialise ordinary merges) is not listed
          # for code that is absent from the image and the published commits.
          BASE_SHA=$(git rev-parse HEAD)

          # Candidate PRs merged since the last tag, excluding mechanical release
          # and snapshot-bump PRs. --paginate follows every page so a window with
          # more than 100 updated PRs is not silently truncated; the per-page --jq
          # streams matching objects, which `jq -s` collects into a single array.
          # merge_commit_sha is kept so the reachability filter below can run.
          gh api --paginate \
            "repos/${{ github.repository }}/pulls?state=closed&base=main&per_page=100&sort=updated&direction=desc" \
            --jq ".[] | select(.merged_at != null and .merged_at > \"${SINCE}\" and (.head.ref | test(\"^(release/v|chore/next-snapshot-v)\") | not)) | {title: .title, number: .number, url: .html_url, merge_commit_sha: .merge_commit_sha}" \
            | jq -s '.' > "$RUNNER_TEMP/candidates.json"

          # Keep only PRs whose merge commit is an ancestor of the checked-out main
          # SHA. A PR merged after this checkout is not reachable from BASE_SHA (its
          # commit may not even be fetched), so it is excluded — the changelog and
          # the artifact therefore describe the same frozen source state.
          jq -c '.[]' "$RUNNER_TEMP/candidates.json" | while read -r pr; do
            sha=$(printf '%s' "$pr" | jq -r '.merge_commit_sha')
            if [ "$sha" != "null" ] && git merge-base --is-ancestor "$sha" "$BASE_SHA" 2>/dev/null; then
              printf '%s' "$pr" | jq '{title, number, url}'
            fi
          done | jq -s '.' > "$RUNNER_TEMP/prs.json"
          PRS=$(cat "$RUNNER_TEMP/prs.json")

          # Empty-changelog guard: with no human review, a broken SINCE filter
          # would otherwise silently publish a release with empty notes.
          if [ "$(echo "$PRS" | jq 'length')" -eq 0 ]; then
            echo "ERROR: no merged PRs found since ${SINCE}. Refusing to publish a release with an empty changelog."
            exit 1
          fi

          PRS_FILE="$RUNNER_TEMP/prs.json" python3 .github/scripts/render_changelog.py > "$RUNNER_TEMP/entry.md"
          cp "$RUNNER_TEMP/entry.md" release_notes.md

          # Prepend the new entry into CHANGELOG.md, keeping the "# Changelog"
          # header at the top if present.
          ENTRY_FILE="$RUNNER_TEMP/entry.md" python3 - <<'PYEOF'
          import os

          with open(os.environ["ENTRY_FILE"]) as f:
              entry = f.read().strip()

          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md") as f:
                  existing = f.read()
              if existing.startswith("# Changelog"):
                  header, _, rest = existing.partition("\n")
                  content = f"{header}\n\n{entry}\n\n{rest.lstrip()}"
              else:
                  content = f"{entry}\n\n{existing}"
          else:
              content = f"# Changelog\n\n{entry}\n"

          with open("CHANGELOG.md", "w") as f:
              f.write(content)
          PYEOF

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5: build the native image and load it locally WITHOUT pushing. Nothing
      # reaches GHCR until the smoke test proves the native binary actually boots.
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tedee-automation:${{ steps.version.outputs.release }}

      # Prove the freshly built native image boots before it is pushed or any
      # tag/release is created. A missing reflection hint aborts the Spring
      # context only in the native binary — ./mvnw verify cannot catch it.
      - name: Smoke test native image
        run: .github/scripts/native-smoke-test.sh tedee-automation:${{ steps.version.outputs.release }}

      # 6: first irreversible external effect. Only a smoke-tested image is
      # published, and only under its IMMUTABLE version tag. The mutable `latest`
      # alias is intentionally NOT updated here: if the atomic git push below is
      # rejected (main advanced) the release aborts, and `latest` must keep
      # pointing at the previous release — never at this unreleased build. The
      # worst case here is an orphan `:version` image (harmless, overwritten next
      # run), never a moved `latest` without a corresponding tag/release.
      - name: Push validated image to GHCR (version tag only)
        run: |
          VERSION="${{ steps.version.outputs.release }}"
          docker tag "tedee-automation:${VERSION}" \
            "ghcr.io/sanmibuh/tedee-auto/tedee-automation:${VERSION}"
          docker push "ghcr.io/sanmibuh/tedee-auto/tedee-automation:${VERSION}"

      # 7: only now touch main. Build BOTH commits locally — the release and the
      # snapshot bump — tag the release commit, and publish everything in a SINGLE
      # `--atomic` push of `HEAD:main` plus the tag: the branch and the tag update
      # together or not at all, so main can never carry the commits without the
      # tag (or vice versa). The push is fast-forward only and is NOT rebased: if
      # main advanced since checkout, the push is rejected and the release aborts
      # rather than publishing code that was never verified, built or changelogged.
      # `concurrency: release` serialises releases, so the operator simply re-runs
      # from the new main state.
      - name: Commit release + snapshot, tag and push atomically
        run: |
          VERSION="${{ steps.version.outputs.release }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"

          git add pom.xml CHANGELOG.md
          git commit -m "Release v${VERSION}"

          ./mvnw versions:set \
            -DnewVersion="${NEXT}" \
            -DgenerateBackupPoms=false \
            -B
          git add pom.xml
          git commit -m "Prepare development iteration v${NEXT}"

          # Tag the release commit (HEAD~1, the parent of the snapshot commit).
          git tag "v${VERSION}" HEAD~1

          if ! git push --atomic origin HEAD:main "refs/tags/v${VERSION}"; then
            echo "ERROR: push rejected — main advanced since this release was verified and built."
            echo "Nothing was published. Re-run the release from the current main state."
            exit 1
          fi

      # 8: only after the release has atomically landed on main is the mutable
      # `latest` alias advanced to this build. Retagging the already-pushed
      # immutable image and pushing `latest` is cheap and, crucially, conditional
      # on the git landing having succeeded — so an aborted run never moves
      # `latest` onto an unreleased image.
      - name: Update GHCR latest alias
        run: |
          VERSION="${{ steps.version.outputs.release }}"
          docker tag "tedee-automation:${VERSION}" \
            "ghcr.io/sanmibuh/tedee-auto/tedee-automation:latest"
          docker push "ghcr.io/sanmibuh/tedee-auto/tedee-automation:latest"

      # 9: create the GitHub Release from the tag using the frozen release notes.
      # This runs last because it is the only externally-visible step that cannot
      # leave main inconsistent: both commits are already on main and main is back
      # on -SNAPSHOT. The release is created idempotently with retry, and can
      # always be recreated by hand from the existing tag if it still fails.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.release }}"
          for attempt in 1 2 3; do
            if gh release view "v${VERSION}" >/dev/null 2>&1; then
              echo "Release v${VERSION} already exists."
              exit 0
            fi
            if gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release_notes.md; then
              exit 0
            fi
            echo "Release creation attempt ${attempt} failed, retrying..."
            sleep 5
          done
          echo "ERROR: failed to create GitHub Release v${VERSION} after 3 attempts. The tag exists; recreate the release from it manually."
          exit 1
