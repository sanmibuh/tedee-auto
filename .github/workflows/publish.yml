name: Publish — Tag, Docker, GitHub Release

on:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Detect release merge
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REF=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].head.ref // ""')

          if [[ "$HEAD_REF" == release/v* ]]; then
            VERSION="${HEAD_REF#release/v}"
            echo "is_release=true"     >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false"    >> "$GITHUB_OUTPUT"
            echo "version="            >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.detect.outputs.version }}"
          git push origin "v${{ needs.detect.outputs.version }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sanmibuh/tedee-auto/tedee-automation:${{ needs.detect.outputs.version }}
            ghcr.io/sanmibuh/tedee-auto/tedee-automation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract changelog section for GitHub Release
        id: notes
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          python3 << 'PYEOF'
          import re, os

          version = os.environ["VERSION"]
          with open("CHANGELOG.md") as f:
              content = f.read()

          pattern = rf"(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          section = match.group(1).strip() if match else f"## [{version}]"

          with open("release_notes.md", "w") as f:
              f.write(section)
          PYEOF
        env:
          VERSION: ${{ needs.detect.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.detect.outputs.version }}" \
            --title "v${{ needs.detect.outputs.version }}" \
            --notes-file release_notes.md

      - name: Create post-release snapshot bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          BRANCH="chore/next-snapshot-v${NEXT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          ./mvnw versions:set \
            -DnewVersion="${NEXT}" \
            -DgenerateBackupPoms=false \
            -B

          git add pom.xml
          git commit -m "chore: prepare next development iteration v${NEXT}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: prepare next development iteration v${NEXT}" \
            --body "Bump version to \`${NEXT}\` after releasing \`v${VERSION}\`."

          gh pr merge "$BRANCH" --auto --squash
