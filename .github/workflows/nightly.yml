name: Nightly AI Review

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ai-review
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build code snapshot
        run: |
          {
            for guide in AGENTS.md ARCHITECTURE.md; do
              if [ -f "$guide" ]; then
                echo "=== FILE: $guide ==="
                cat "$guide"
                echo ""
              fi
            done
            echo "=== PROJECT STRUCTURE ==="
            find src -name "*.java" | sort
            echo ""
            find src -name "*.java" | sort | while read -r f; do
              echo "=== FILE: $f ==="
              cat "$f"
              echo ""
            done
          } > code_snapshot.txt

      - name: Fetch open AI review issues
        run: |
          gh api \
            "repos/${{ github.repository }}/issues?labels=ai-review&state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | {number: .number, title: .title, body: .body}]' \
            > open_issues.json
          echo "Open ai-review issues:"
          cat open_issues.json

      - name: Run Gemini review
        if: env.GEMINI_API_KEY != ''
        run: |
          MODELS=("gemini-3.1-pro-preview" "gemini-3.7-flash" "gemini-3.5-flash" "gemini-3.5-flash-lite")
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            python3 .github/scripts/gemini_review.py "$MODEL"
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              break
            elif [ $EXIT -eq 2 ]; then
              echo "Quota exceeded for $MODEL, trying next..."
              continue
            else
              exit $EXIT
            fi
          done

      - name: Create issues for new findings
        if: env.GEMINI_API_KEY != '' && hashFiles('findings.json') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { model, findings } = JSON.parse(fs.readFileSync('findings.json', 'utf8'));

            if (findings.length === 0) {
              console.log('No new findings — nothing to create.');
              return;
            }

            const label = 'ai-review';
            const modelLabel = `model: ${model}`;
            const priorityLabel = { high: '🔴', medium: '🟡', low: '🟢' };

            // Ensure labels exist
            for (const [name, color, description] of [
              [label,      '8B5CF6', 'Automated AI code review'],
              [modelLabel, '0EA5E9', `Review generated by ${model}`],
            ]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }

            for (const finding of findings) {
              const priority = priorityLabel[finding.priority] ?? '🟢';
              const footer = `\n\n---\n> ${priority} ${finding.priority} priority · Model: ${model} · ${new Date().toUTCString()}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: finding.title,
                body: finding.body + footer,
                labels: [label, modelLabel]
              });
              console.log(`Created issue: ${finding.title}`);
            }
