name: Nightly AI Review

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ai-review
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build code snapshot
        run: |
          {
            for guide in AGENTS.md ARCHITECTURE.md; do
              if [ -f "$guide" ]; then
                echo "=== FILE: $guide ==="
                cat "$guide"
                echo ""
              fi
            done
            echo "=== PROJECT STRUCTURE ==="
            find src -name "*.java" | sort
            echo ""
            find src -name "*.java" | sort | while read -r f; do
              echo "=== FILE: $f ==="
              cat "$f"
              echo ""
            done
          } > code_snapshot.txt

      - name: Fetch open AI review issues
        run: |
          gh api \
            "repos/${{ github.repository }}/issues?labels=ai-review&state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | {number: .number, title: .title, body: .body}]' \
            > open_issues.json
          echo "Open ai-review issues:"
          cat open_issues.json

      - name: Run Gemini review
        if: env.GEMINI_API_KEY != ''
        run: |
          MODELS=("gemini-2.5-pro" "gemini-2.5-flash")
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            python3 << PYEOF
          import os, json, urllib.request, urllib.error, sys

          model = "$MODEL"

          with open("code_snapshot.txt") as f:
            code = f.read()

          with open("open_issues.json") as f:
            open_issues = json.load(f)

          if open_issues:
            open_issues_text = "\n".join(
              f"- #{i['number']}: {i['title']}\n  {(i['body'] or '')[:300]}"
              for i in open_issues
            )
            open_issues_section = f"""
ALREADY REPORTED (open issues — do NOT create findings for these):
{open_issues_text}
"""
          else:
            open_issues_section = ""

          prompt = f"""You are a senior software engineer performing a nightly automated code review.
The project guidelines and quality standards are defined in AGENTS.md (included below).
The architecture is described in ARCHITECTURE.md (included below).
Use both as the reference for this review — do not apply standards from outside these documents.
{open_issues_section}
Analyze the codebase and identify concrete, actionable findings across these areas:
- Clean Code & Best Practices (naming, dead code, DRY, method size, magic values)
- Test Quality / TDD (behavior testing, naming convention, BDDAssertions, missing cases)
- SOLID & Architecture (layer dependencies, domain isolation, SOLID violations)
- Documentation (ARCHITECTURE.md accuracy, comments that restate code)

Rules:
- Each finding must be specific: reference actual class names and method names.
- Do NOT report findings already listed in "ALREADY REPORTED" above.
- Do NOT invent problems. If the code is clean in an area, skip it.
- Return ONLY a JSON array. No explanation outside the JSON.

Each finding must have:
- "title": short descriptive title (max 80 chars), prefixed with the area: [Clean Code], [TDD], [SOLID], or [Docs]
- "priority": "high", "medium", or "low"
- "body": full markdown description with the problem, why it matters, and a concrete suggestion (with code example if useful)

Example format:
[
  {{
    "title": "[TDD] Missing edge case in HandlerLookupTest for duplicate handler registration",
    "priority": "medium",
    "body": "## Problem\\n...\\n## Suggestion\\n..."
  }}
]

If there are no new findings, return an empty array: []

CODEBASE AND GUIDELINES:
{code}
"""

          payload = {
            "contents": [{"parts": [{"text": prompt}]}],
            "generationConfig": {
              "temperature": 0.2,
              "maxOutputTokens": 8192,
              "responseMimeType": "application/json"
            }
          }

          req = urllib.request.Request(
            f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={os.environ['GEMINI_API_KEY']}",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST"
          )
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
            if e.code == 429:
              print(f"Quota exceeded for {model}, will try next model", file=sys.stderr)
              sys.exit(2)
            print(f"Gemini API error: {e.code} {e.read().decode()}", file=sys.stderr)
            sys.exit(1)

          candidates = data.get("candidates", [])
          if not candidates or not candidates[0].get("content", {}).get("parts"):
            finish = candidates[0].get("finishReason", "UNKNOWN") if candidates else "NO_CANDIDATES"
            print(f"Gemini returned no content (model={model}). finishReason: {finish}", file=sys.stderr)
            sys.exit(1)

          raw = candidates[0]["content"]["parts"][0]["text"]
          try:
            findings = json.loads(raw)
          except json.JSONDecodeError as e:
            print(f"Failed to parse Gemini response as JSON: {e}\nRaw: {raw[:500]}", file=sys.stderr)
            sys.exit(1)

          with open("findings.json", "w") as f:
            json.dump({"model": model, "findings": findings}, f)

          print(f"Found {len(findings)} new finding(s) with {model}")
          PYEOF

            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              break
            elif [ $EXIT -eq 2 ]; then
              echo "Quota exceeded for $MODEL, trying next..."
              continue
            else
              exit $EXIT
            fi
          done

      - name: Create issues for new findings
        if: env.GEMINI_API_KEY != '' && hashFiles('findings.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { model, findings } = JSON.parse(fs.readFileSync('findings.json', 'utf8'));

            if (findings.length === 0) {
              console.log('No new findings — nothing to create.');
              return;
            }

            const label = 'ai-review';
            const modelLabel = `model: ${model}`;
            const priorityLabel = { high: '🔴', medium: '🟡', low: '🟢' };

            // Ensure labels exist
            for (const [name, color, description] of [
              [label,      '8B5CF6', 'Automated AI code review'],
              [modelLabel, '0EA5E9', `Review generated by ${model}`],
            ]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            }

            for (const finding of findings) {
              const priority = priorityLabel[finding.priority] ?? '🟢';
              const footer = `\n\n---\n> ${priority} ${finding.priority} priority · Model: ${model} · ${new Date().toUTCString()}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: finding.title,
                body: finding.body + footer,
                labels: [label, modelLabel]
              });
              console.log(`Created issue: ${finding.title}`);
            }
