name: Native image smoke test

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: native-smoke
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tedee-automation:native-smoke

      - name: Run native smoke test
        run: .github/scripts/native-smoke-test.sh tedee-automation:native-smoke
