name: Main — Save Coverage

on:
  push:
    branches: [ "main" ]

jobs:
  save-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore pitest history for incremental analysis
        run: |
          git fetch origin coverage-data 2>/dev/null || true
          mkdir -p .pit
          git show origin/coverage-data:pitest-history.bin > .pit/history-input.bin 2>/dev/null || true

      - name: Build and test
        run: ./mvnw verify -B

      - name: Run mutation tests (incremental)
        run: ./mvnw pitest:mutationCoverage -B

      - name: Extract metrics
        id: metrics
        run: |
          JACOCO_XML="target/site/jacoco/jacoco.xml"
          extract_metric() {
            local type=$1
            local missed covered total
            missed=$(grep -oP "type=\"${type}\" missed=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
            covered=$(grep -oP "type=\"${type}\" missed=\"[0-9]+\" covered=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
            total=$((missed + covered))
            local pct
            if [ "$total" -eq 0 ]; then pct=-1; else pct=$((covered * 100 / total)); fi
            echo "$pct $covered $total"
          }

          read -r instruction_pct instruction_covered instruction_total <<< "$(extract_metric INSTRUCTION)"
          read -r branch_pct      branch_covered      branch_total      <<< "$(extract_metric BRANCH)"
          read -r line_pct        line_covered        line_total        <<< "$(extract_metric LINE)"
          read -r method_pct      method_covered      method_total      <<< "$(extract_metric METHOD)"
          read -r class_pct       class_covered       class_total       <<< "$(extract_metric CLASS)"

          cat > coverage.json << EOF
          {
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "instruction": ${instruction_pct},
            "instruction_covered": ${instruction_covered},
            "instruction_total": ${instruction_total},
            "branch": ${branch_pct},
            "branch_covered": ${branch_covered},
            "branch_total": ${branch_total},
            "line": ${line_pct},
            "line_covered": ${line_covered},
            "line_total": ${line_total},
            "method": ${method_pct},
            "method_covered": ${method_covered},
            "method_total": ${method_total},
            "class": ${class_pct},
            "class_covered": ${class_covered},
            "class_total": ${class_total}
          }
          EOF

          MUTATIONS_XML="target/pit-reports/mutations.xml"
          if [ -f "$MUTATIONS_XML" ]; then
            TOTAL=$(grep -c '<mutation ' "$MUTATIONS_XML") || TOTAL=0
            KILLED=$(grep -oP "status='\K[^']+" "$MUTATIONS_XML" | grep -c "^KILLED$") || KILLED=0
            SCORE=$([ "$TOTAL" -gt 0 ] && echo "$((KILLED * 100 / TOTAL))" || echo "-1")
          else
            TOTAL=0; KILLED=0; SCORE=-1
          fi

          cat > pitest.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total": ${TOTAL},
            "killed": ${KILLED},
            "score": ${SCORE}
          }
          EOF

          cat coverage.json
          cat pitest.json

          badge_color() {
            local pct=$1
            if [ "$pct" -ge 100 ]; then echo "brightgreen"
            elif [ "$pct" -ge 90 ]; then echo "orange"
            else echo "red"; fi
          }

          write_badge() {
            local file=$1 label=$2 pct=$3
            local message color
            if [ "$pct" -lt 0 ]; then message="unknown"; color="lightgrey"
            else message="${pct}%"; color=$(badge_color "$pct"); fi
            cat > "$file" <<EOF
          {
            "schemaVersion": 1,
            "label": "${label}",
            "message": "${message}",
            "color": "${color}"
          }
          EOF
          }

          write_badge coverage-badge.json coverage "$line_pct"
          write_badge mutation-badge.json mutation "$SCORE"

          cat coverage-badge.json
          cat mutation-badge.json

      - name: Push metrics and pitest history to coverage-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_DIR=$(mktemp -d)
          cd "$DATA_DIR"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git fetch --depth=1 origin coverage-data 2>/dev/null; then
            git checkout -b coverage-data FETCH_HEAD
          else
            git checkout --orphan coverage-data
          fi

          cp "$GITHUB_WORKSPACE/coverage.json" .
          cp "$GITHUB_WORKSPACE/pitest.json" .
          cp "$GITHUB_WORKSPACE/coverage-badge.json" .
          cp "$GITHUB_WORKSPACE/mutation-badge.json" .
          cp "$GITHUB_WORKSPACE/.pit/history-output.bin" pitest-history.bin 2>/dev/null || touch pitest-history.bin

          git add coverage.json pitest.json coverage-badge.json mutation-badge.json pitest-history.bin
          git commit -m "coverage: ${{ github.sha }}"
          git push origin HEAD:coverage-data

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site/coverage site/mutation
          cp -r target/site/jacoco/. site/coverage/
          cp -r target/pit-reports/. site/mutation/
          rm -f site/mutation/mutations.xml

          LINE_PCT=$(grep -oP '"message": "\K[^"]+' coverage-badge.json)
          MUT_PCT=$(grep -oP '"message": "\K[^"]+' mutation-badge.json)
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>tedee-auto — Quality reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { margin-bottom: 0.25rem; }
              .cards { display: grid; gap: 1rem; margin-top: 2rem; }
              a.card { display: block; padding: 1.25rem 1.5rem; border: 1px solid #d0d7de; border-radius: 8px; text-decoration: none; color: inherit; }
              a.card:hover { border-color: #0969da; }
              .metric { font-weight: 600; color: #0969da; }
              footer { margin-top: 3rem; color: #57606a; font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <h1>tedee-auto</h1>
            <p>Quality reports for the latest <code>main</code> build.</p>
            <div class="cards">
              <a class="card" href="coverage/index.html">
                <div>JaCoCo Coverage report</div>
                <div class="metric">Lines: ${LINE_PCT}</div>
              </a>
              <a class="card" href="mutation/index.html">
                <div>PITest Mutation report</div>
                <div class="metric">Mutation score: ${MUT_PCT}</div>
              </a>
            </div>
            <footer>Commit <code>${{ github.sha }}</code></footer>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
