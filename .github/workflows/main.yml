name: Main — Save Coverage

on:
  push:
    branches: [ "main" ]

jobs:
  save-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: ./mvnw verify -B

      - name: Extract coverage metrics
        id: coverage
        run: |
          JACOCO_XML="target/site/jacoco/jacoco.xml"

          extract_pct() {
            local type=$1
            local missed covered total
            missed=$(grep -oP "type=\"${type}\" missed=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
            covered=$(grep -oP "type=\"${type}\" missed=\"[0-9]+\" covered=\"\K[0-9]+" "$JACOCO_XML" | awk '{s+=$1} END {print s+0}')
            total=$((missed + covered))
            if [ "$total" -eq 0 ]; then echo "-1"; else echo "$((covered * 100 / total))"; fi
          }

          cat > coverage.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "instruction": $(extract_pct INSTRUCTION),
            "branch": $(extract_pct BRANCH),
            "line": $(extract_pct LINE),
            "method": $(extract_pct METHOD),
            "class": $(extract_pct CLASS)
          }
          EOF

          cat coverage.json

      - name: Push coverage to orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin coverage-data 2>/dev/null || true

          # Work in a temp dir to avoid conflicts with the current checkout
          TMPDIR=$(mktemp -d)
          cp coverage.json "$TMPDIR/coverage.json"

          if git ls-remote --exit-code origin coverage-data > /dev/null 2>&1; then
            git worktree add "$TMPDIR/coverage-branch" origin/coverage-data
          else
            # Branch does not exist yet — create it as orphan inside a worktree
            git worktree add --orphan -b coverage-data "$TMPDIR/coverage-branch"
          fi

          cp "$TMPDIR/coverage.json" "$TMPDIR/coverage-branch/coverage.json"

          cd "$TMPDIR/coverage-branch"
          git add coverage.json
          git commit -m "coverage: ${{ github.sha }}"
          git push origin coverage-data
