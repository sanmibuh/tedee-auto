version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    ignore:
      # GraalVM Native Maven Plugin is managed manually alongside the GraalVM toolchain
      - dependency-name: "org.graalvm.buildtools:native-maven-plugin"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"

  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    ignore:
      # The GraalVM image tracks the Java language level and toolchain, which are managed manually
      - dependency-name: "ghcr.io/graalvm/native-image-community"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/liquibase"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 10
    rebase-strategy: auto
